name: Feature request
description: Suggest a controller, action, workflow, safety, or interface improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome you need. Do not include profiles, mappings, typed text, key histories, raw device paths, serial numbers, usernames, secrets, or private application data.
  - type: textarea
    id: need
    attributes:
      label: What would you like Tappy to do?
      description: Explain the user outcome and why it would be useful.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Controller discovery or identification
        - Mapping or layers
        - Visual layout or accessibility
        - Safety or recovery
        - Diagnostics or hardware evidence
        - Packaging or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Suggested behavior
      description: Explain the interaction you imagine, including any pass-through or output expectations.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. What do you do today?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this request and every attachment and removed private input, identifiers, paths, profiles, mappings, and secrets.
          required: true
