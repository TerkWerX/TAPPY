name: Crash report
description: Report Tappy closing unexpectedly without exposing private input
title: "[Crash]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Tappy does not upload crash data automatically. Describe the crash below and attach only material you personally inspected and redacted. Do not post Windows memory dumps, profiles, mappings, typed text, key histories, raw device paths, usernames, secrets, or unreviewed Event Viewer exports.
  - type: input
    id: version
    attributes:
      label: Tappy version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows edition and build
      placeholder: Windows 11 24H2, OS build 26100.x
    validations:
      required: true
  - type: textarea
    id: activity
    attributes:
      label: What was Tappy doing just before it closed?
      description: Mention selection, identification, output mode, suspend/resume, disconnect, or shutdown if relevant; do not include captured input.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Can you reproduce it?
      description: List the shortest safe sequence that causes the problem, if known.
  - type: textarea
    id: error
    attributes:
      label: Reviewed error details
      description: Optional. Paste only a short, redacted exception name/message or attach a redacted screenshot—not a dump or unreviewed export.
  - type: checkboxes
    id: safety
    attributes:
      label: Output recovery
      options:
        - label: I checked whether any Tappy-generated key remained held and used Emergency stop if needed.
          required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this issue and every attachment and removed private input, identifiers, paths, profiles, mappings, and secrets.
          required: true
